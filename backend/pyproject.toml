[project]
name = "obsly-backend"
version = "0.1.0"
description = "Obsly ingest and API server"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<7",
    "djangorestframework>=3.17",
    "psycopg[binary]>=3.3",
    "django-environ>=0.12",
    # Runtime, not dev: settings.py calls monkeypatch() so admin generics work at import time.
    "django-stubs-ext>=5.1",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-env>=1.1",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "S",    # bandit
    "T20",  # no print
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "S101",  # assert is how pytest asserts
    # Django's entire configuration style is mutable class attributes — Meta.ordering,
    # Meta.constraints, ModelAdmin.inlines. Annotating every one as ClassVar is noise that
    # obscures the handful of places where a mutable default is genuinely a bug.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded credentials are the point in fixtures

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"

filterwarnings = [
    # A warning nobody fails on is a warning nobody reads.
    "error",
    # whitenoise warns until collectstatic has run. The container runs it at startup and tests
    # never serve static assets, so there is nothing to fix here.
    "ignore:No directory at:UserWarning",
]

# Set via pytest-env, not conftest.py: pytest-django runs django.setup() inside
# pytest_load_initial_conftests, before any conftest module is imported, so a conftest can never
# influence settings. pytest-env hooks the same phase tryfirst.
#   plain NAME= forces the value, D:NAME= only supplies a default.
env = [
    # Forced. Tests must exercise the production security posture; a developer whose .env says
    # DEBUG=True must not get a quieter run than CI. This exact gap hid an SSL-redirect bug.
    "DJANGO_DEBUG=False",
    # Defaults. CI and local Postgres live at different addresses.
    "D:DJANGO_SECRET_KEY=test-key-not-used-outside-tests",
    "D:DATABASE_URL=postgres://obsly:obsly@localhost:5432/obsly",
]

[tool.coverage.run]
source = ["config", "apps"]
# wsgi/asgi are framework entry points — covering them would test Django, not Obsly.
omit = ["*/migrations/*", "*/tests/*", "*/wsgi.py", "*/asgi.py"]
