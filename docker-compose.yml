services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: obsly
      POSTGRES_PASSWORD: obsly
      POSTGRES_DB: obsly
    ports:
      # Overridable: a host often already runs Postgres, or another stack, on these ports.
      - "${OBSLY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsly"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Dev-only default. A real deployment must supply this; settings.py has no fallback.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-dev-only-not-a-production-secret}
      # Production-like error handling, but this stack serves plain HTTP: without DJANGO_HTTPS
      # off, SSL redirect would bounce every request and Secure cookies would block admin login.
      DJANGO_DEBUG: "False"
      DJANGO_HTTPS: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://obsly:obsly@postgres:5432/obsly
    # ponytail: migrate on boot is right for one instance; move to a job before running
    # replicas, or they race each other on the same migration.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
             --access-logfile - --error-logfile -"
    ports:
      - "${OBSLY_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in python:slim, and adding it just for a healthcheck is a wasted layer.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: ./frontend
    ports:
      # 8080 is the most contested port on any dev machine — default off it.
      - "${OBSLY_WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
