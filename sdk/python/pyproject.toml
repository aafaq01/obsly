[project]
name = "obsly"
version = "0.3.0"
description = "Obsly SDK for Python — errors, tracing, logs and performance, with no runtime dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aafaq Rana", email = "m.aafaq.rana@gmail.com" }]
keywords = [
    "observability",
    "error-tracking",
    "tracing",
    "apm",
    "monitoring",
    "opentelemetry",
    "fastapi",
    "asgi",
    "wsgi",
    "flask",
    "django",
]

# The zero-dependency promise is the SDK's whole point, and an empty list is how it is stated
# to anyone reading the metadata rather than the README.
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aafaq01/obsly"
Repository = "https://github.com/aafaq01/obsly"
Issues = "https://github.com/aafaq01/obsly/issues"
Changelog = "https://github.com/aafaq01/obsly/releases"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "fastapi>=0.115",
    "httpx2>=0.1",
    # All exercised by optional integration tests, never runtime dependencies. Every one of
    # these is a framework the SDK claims to support, and a claim nothing runs is a guess.
    "sqlalchemy>=2.0",
    "flask>=3.0",
    "django>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsly"]
# PEP 561. Without the marker in the wheel, a consumer's type checker ignores every
# annotation in a package that passes mypy --strict.
artifacts = ["obsly/py.typed"]

[tool.hatch.build.targets.sdist]
# The tests ship with the source distribution so a packager can run them; nothing else in the
# directory belongs in a release.
include = ["obsly", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "C4", "S", "T20", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

# SQLAlchemy is an optional integration, not a dependency. The SDK must type-check on a
# machine that does not have it.
[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "flask.*", "django.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]
