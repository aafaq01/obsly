name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: obsly
          POSTGRES_PASSWORD: obsly
          POSTGRES_DB: obsly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obsly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-key-not-used-outside-ci
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://obsly:obsly@localhost:5432/obsly

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy .

      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  stack:
    # The README promises `docker compose up` works. Without this job that promise rots the
    # first time someone edits a Dockerfile, and nobody finds out until they try to run it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          echo "--- health, proxied to Django ---"
          curl -sf http://localhost:8081/health/ | tee /dev/stderr | grep -q '"database": "ok"'
          echo "--- SPA shell ---"
          curl -sf http://localhost:8081/ | grep -q '<div id="root">'
          echo "--- admin, proving migrations ran and whitenoise serves static ---"
          curl -sf -o /dev/null -w '%{http_code}\n' http://localhost:8081/admin/login/ | grep -q 200

      - name: POST through nginx with a browser Origin header
        run: |
          set -euo pipefail
          # A plain curl POST omits Origin and passes even when the proxy mangles Host, which is
          # how a CSRF failure reached a browser while CI stayed green. Send Origin like a
          # browser does, and require anything except 403.
          docker compose exec -T \
            -e DJANGO_SUPERUSER_USERNAME=citest \
            -e DJANGO_SUPERUSER_EMAIL=ci@example.com \
            -e DJANGO_SUPERUSER_PASSWORD=ci-test-password \
            backend python manage.py createsuperuser --noinput

          jar=$(mktemp)
          token=$(curl -sf -c "$jar" http://localhost:8081/admin/login/ \
            | sed -n 's/.*name="csrfmiddlewaretoken" value="\([^"]*\)".*/\1/p' | head -1)
          test -n "$token"

          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'Origin: http://localhost:8081' \
            -e http://localhost:8081/admin/login/ \
            -d "username=citest&password=ci-test-password&csrfmiddlewaretoken=$token" \
            http://localhost:8081/admin/login/)

          echo "login with Origin -> HTTP $code"
          if [ "$code" = "403" ]; then
            echo "CSRF rejected the browser Origin — the proxy is not forwarding Host with its port"
            exit 1
          fi
          test "$code" = "302"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v
