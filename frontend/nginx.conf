server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ingest payloads are batched envelopes, not form posts.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Declared once at server level; location blocks inherit these, so every proxied route
    # gets the same headers without repeating them four times.
    #
    # $http_host, not $host: $host drops the port, so Django's get_host() returns "localhost"
    # while the browser's Origin header says "localhost:8081". Django compares the two on every
    # unsafe method and rejects the mismatch, which makes every POST — including admin login —
    # fail CSRF validation with "does not match any trusted origins".
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location = /health/ {
        proxy_pass http://backend:8000;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Django admin, and the static assets whitenoise serves for it.
    location /admin/ {
        proxy_pass http://backend:8000;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Hashed bundles are immutable; index.html must never be cached or a deploy is invisible.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — the router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
