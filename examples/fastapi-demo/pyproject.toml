[project]
name = "obsly-fastapi-demo"
version = "0.1.0"
description = "A FastAPI app that fails on purpose, to exercise Obsly"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "obsly>=0.4.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "SIM", "RUF"]
# T20 off: drive.py prints a summary, which is its entire output.
# S311 off: this app simulates flaky behaviour. Nothing here is a secret.
ignore = ["S311"]
